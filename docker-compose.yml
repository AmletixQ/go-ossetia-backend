services:
  postgres:
    container_name: go-ossetia-backend
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
    restart: unless-stopped

